# Publish the device to GitHub Pages.
#
# `frontend/` is the whole site: one self-contained HTML file plus the dev
# server that is never used here. There is no build step and nothing to install
# — genlayer-js is imported from esm.sh at runtime — so this workflow only has
# to copy a directory and hand it to Pages.
#
# Nothing to switch on by hand: `enablement: true` below turns Pages on through
# the API on the first run. Without it the very first run dies at
# `configure-pages` with "Get Pages site failed … Not Found" — Pages has to
# exist before it can be configured, and a fresh repo has none. Measured here on
# run 1, which failed in 15 s for exactly that reason.
#
# The published address is https://<user>.github.io/<repo>/ — free, HTTPS, no
# domain to buy. A custom domain is optional and changes nothing here.
name: Publish the frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      # The contract ships WITH the page — the browser fetches it to hatch a pet
      # — so a change to the contract has to republish the site, or the button
      # would go on deploying last week's pet.
      - "contracts/ai_pet.py"
      - "tools/buildContract.py"
      - ".github/workflows/pages.yml"
  # …and a button, for publishing without touching the frontend.
  workflow_dispatch:

# Pages needs to mint an id-token to deploy; nothing here needs write access to
# the repository itself.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two publishes race. `cancel-in-progress: false` because a half-
# finished deploy is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the page is really self-contained
        # The one way this site can break after publishing is a relative
        # <script src>/<link href> that worked locally and 404s under the
        # /<repo>/ path prefix Pages serves from. Catch it here rather than in
        # a screenshot of a blank page.
        run: |
          if grep -nE '<(script|link)[^>]+(src|href)="[^"h#/]' frontend/index.html; then
            echo "::error::relative asset reference — it will 404 under the Pages path prefix"
            exit 1
          fi
          echo "no relative asset references"

      - name: Build the contract the page deploys
        # The page hatches a pet by fetching this file and deploying it, so the
        # site is not complete without it. It is the STRIPPED artifact, not the
        # source: Bradbury refuses a deploy over ~52 KB at gas estimation and the
        # source is 57 KB. buildContract.py fails loudly if it ever stops fitting,
        # which is the only reason this is a build step and not a committed copy.
        run: |
          python3 tools/buildContract.py contracts/ai_pet.py -o frontend/ai_pet.py
          bytes=$(wc -c < frontend/ai_pet.py)
          echo "artifact ${bytes} bytes"
          if [ "$bytes" -gt 53248 ]; then
            echo "::error::artifact is ${bytes} bytes, over the ~52 KB Bradbury deploy ceiling"
            exit 1
          fi

      - uses: actions/configure-pages@v5
        with:
          # Create the Pages site if the repo has none, instead of failing.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - id: deploy
        uses: actions/deploy-pages@v4
